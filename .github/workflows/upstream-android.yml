name: Dispatch local-mode upstream compatibility

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: upstream-android-dispatch
  cancel-in-progress: false

jobs:
  dispatch-local-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Start the guarded local-mode workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run upstream-android.yml --repo "$REPOSITORY" --ref local-mode
