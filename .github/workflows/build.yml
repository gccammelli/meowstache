# Builds and tests every push and pull request. A "v*" tag also builds the signed APK
# and publishes it as a GitHub Release, so nobody has to wait for F-Droid.
# A push to local-mode publishes the preview: the APK as soon as it's built, the .ipa when the iOS job ends.
name: Build

on:
  push:
    branches: [main, local-mode]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a run still in progress, so an older build never overwrites a newer preview.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEOWSTACHE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Decode preview signing key
        # Previews use their own test key (Android's standard debug-key passwords), so they install over each other.
        if: github.ref == 'refs/heads/local-mode'
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          [ -n "$BETA_KEYSTORE_BASE64" ] || { echo "::error::Add the BETA_KEYSTORE_BASE64 secret (base64 of the preview keystore)"; exit 1; }
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.jks"
          {
            echo "MEOWSTACHE_KEYSTORE=$RUNNER_TEMP/beta.jks"
            echo "MEOWSTACHE_KEYSTORE_PASSWORD=android"
            echo "MEOWSTACHE_KEY_ALIAS=androiddebugkey"
            echo "MEOWSTACHE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MEOWSTACHE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" MEOWSTACHE_KEY_ALIAS="$KEY_ALIAS" MEOWSTACHE_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish the preview APK
        if: github.ref == 'refs/heads/local-mode'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/publish-preview.sh app/build/outputs/apk/release/app-release.apk apk
          git tag -f preview-local-mode && git push -f origin refs/tags/preview-local-mode

      - name: Name the APK
        if: startsWith(github.ref, 'refs/tags/v')
        # A fixed name too, so releases/latest/download/meowstache.apk always links the newest version.
        run: |
          cp app/build/outputs/apk/release/app-release.apk "meowstache-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk meowstache.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            meowstache-*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meowstache-${{ github.ref_name }}.apk
            meowstache.apk
          generate_release_notes: true

  # iOS: unsigned .ipa (users sign it with their own Apple ID via SideStore/AltStore) plus simulator
  # screenshots, all on GitHub's free macOS runners, so no Mac is needed to build.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build unsigned .ipa
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/ios/Release-iphoneos/Meowstache.app Payload/
          zip -qry meowstache.ipa Payload

      - name: Simulator screenshots (intro, then demo mode)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/build/ios-sim" CODE_SIGNING_ALLOWED=NO build
          TYPE=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9](-Pro)?' | tail -1)
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          DEV=$(xcrun simctl create meow "$TYPE" "$RUNTIME")
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV"
          xcrun simctl install "$DEV" build/ios-sim/Debug-iphonesimulator/Meowstache.app
          mkdir -p screenshots
          xcrun simctl launch "$DEV" io.github.gccammelli.meowstache; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/1-intro.png
          xcrun simctl terminate "$DEV" io.github.gccammelli.meowstache
          xcrun simctl launch "$DEV" io.github.gccammelli.meowstache --demo; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/2-demo-home.png
          xcrun simctl ui "$DEV" appearance dark; sleep 5
          xcrun simctl io "$DEV" screenshot screenshots/3-demo-home-dark.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Meowstache"' --style compact | tail -100 > screenshots/app-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            meowstache.ipa
            screenshots/

      - name: Publish the preview .ipa
        if: github.ref == 'refs/heads/local-mode'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish-preview.sh meowstache.ipa ipa

      - name: Attach .ipa to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # A fixed name too, so releases/latest/download/meowstache.ipa always links the newest version.
        run: cp meowstache.ipa "meowstache-${GITHUB_REF_NAME}.ipa"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meowstache-${{ github.ref_name }}.ipa
            meowstache.ipa
