# Builds and tests every push and pull request. A "v*" tag also builds the signed APK
# and publishes it as a GitHub Release, so nobody has to wait for F-Droid.
# A push to main publishes the preview: the APK as soon as it's built, the .ipa when the iOS job ends.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run still in progress, so an older build never overwrites a newer preview.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      - name: Test
        run: |
          python3 tools/upstream-lr4.py --self-test
          python3 tools/upstream-lr4.py --verify
          python3 tools/autonomous-android.py self-test
          python3 .github/scripts/public_issue_patch.py --self-test
          ./gradlew testDebugUnitTest :shared:koverXmlReportDebug

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: shared/build/reports/kover/reportDebug.xml
          retention-days: 1

      - name: Build isolated Android UI test app
        run: ./gradlew -Pmeowstache.testbed assembleDebug

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Android UI and local-mode controls
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tools/android-smoke.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Android UI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-ui-evidence
          path: build/android-smoke/

      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEOWSTACHE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Decode preview signing key
        # Previews use their own test key (Android's standard debug-key passwords), so they install over each other.
        if: github.ref == 'refs/heads/main'
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          [ -n "$BETA_KEYSTORE_BASE64" ] || { echo "::error::Add the BETA_KEYSTORE_BASE64 secret (base64 of the preview keystore)"; exit 1; }
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.jks"
          {
            echo "MEOWSTACHE_KEYSTORE=$RUNNER_TEMP/beta.jks"
            echo "MEOWSTACHE_KEYSTORE_PASSWORD=android"
            echo "MEOWSTACHE_KEY_ALIAS=androiddebugkey"
            echo "MEOWSTACHE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MEOWSTACHE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" MEOWSTACHE_KEY_ALIAS="$KEY_ALIAS" MEOWSTACHE_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Exercise the signed release APK before publication
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tools/android-smoke.sh app/build/outputs/apk/release/app-release.apk --production-on-emulator

      - name: Signed release UI evidence
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-android-ui-evidence
          path: build/android-smoke/

      - name: Name the APK
        if: startsWith(github.ref, 'refs/tags/v')
        # A fixed name too, so releases/latest/download/meowstache.apk always links the newest version.
        run: |
          cp app/build/outputs/apk/release/app-release.apk "meowstache-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk meowstache.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: |
            meowstache-*.apk
            meowstache.apk
            app/build/outputs/apk/release/*.apk

  # iOS: unsigned .ipa (users sign it with their own Apple ID via SideStore/AltStore) plus simulator
  # screenshots, all on GitHub's free macOS runners, so no Mac is needed to build.
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosX64Test

      - name: Build unsigned .ipa
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/ios/Release-iphoneos/Meowstache.app Payload/
          # Ad-hoc signature: some sideloading tools can't re-sign a binary that has none ("integrity could not be verified").
          codesign --force --sign - --timestamp=none Payload/Meowstache.app
          zip -qry meowstache.ipa Payload

      - name: Simulator screenshots (intro, then demo mode)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug -sdk iphonesimulator -arch x86_64 \
            SYMROOT="$PWD/build/ios-sim" CODE_SIGNING_ALLOWED=NO build
          TYPE=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9](-Pro)?' | tail -1)
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          DEV=$(xcrun simctl create meow "$TYPE" "$RUNTIME")
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV"
          xcrun simctl install "$DEV" build/ios-sim/Debug-iphonesimulator/Meowstache.app
          mkdir -p screenshots
          xcrun simctl launch "$DEV" io.github.gccammelli.meowstache; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/1-intro.png
          xcrun simctl terminate "$DEV" io.github.gccammelli.meowstache
          xcrun simctl launch "$DEV" io.github.gccammelli.meowstache --demo; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/2-demo-home.png
          xcrun simctl ui "$DEV" appearance dark; sleep 5
          xcrun simctl io "$DEV" screenshot screenshots/3-demo-home-dark.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Meowstache"' --style compact | tail -100 > screenshots/app-log.txt || true

      - name: Name the release IPA
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp meowstache.ipa "meowstache-${GITHUB_REF_NAME}.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios
          path: |
            meowstache*.ipa
            screenshots/

  coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: reportDebug.xml
          flags: android-unit
          fail_ci_if_error: false
          use_oidc: true

  publish:
    needs: [build, ios]
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.build.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk
          path: apk-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios
          path: ios-artifact
      - name: Publish previews
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find apk-artifact -name app-release.apk -print -quit)
          .github/publish-preview.sh "$apk" apk
          .github/publish-preview.sh ios-artifact/meowstache.ipa ipa
          git tag -f preview-local-mode
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push -f origin refs/tags/preview-local-mode
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            apk-artifact/meowstache-${{ github.ref_name }}.apk
            apk-artifact/meowstache.apk
            ios-artifact/meowstache-${{ github.ref_name }}.ipa
            ios-artifact/meowstache.ipa
          generate_release_notes: true
